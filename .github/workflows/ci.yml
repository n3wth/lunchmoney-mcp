name: Release checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/*/package-lock.json
      - run: npm ci && npm test
        working-directory: packages/auth-contract
      - run: npm ci && npm test
        working-directory: packages/lunchmoney-adapter
      - run: npm ci && npm test
        working-directory: packages/server
      - run: npm ci && npm run build
      - name: Validate plugin packages and production isolation
        run: node scripts/validate-release.mjs
      - name: Bundle staging Worker
        run: npx wrangler deploy --dry-run
        working-directory: packages/server
      - name: Bundle production Worker
        run: npx wrangler deploy --dry-run --config wrangler.production.jsonc
        working-directory: packages/server
