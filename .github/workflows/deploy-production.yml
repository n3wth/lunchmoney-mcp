name: Deploy production Worker
on:
  push:
    branches: [main]
    paths:
      - 'packages/server/**'
      - 'packages/lunchmoney-adapter/**'
      - 'packages/auth-contract/**'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:
concurrency:
  group: deploy-production-worker
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/*/package-lock.json
      - name: Require Cloudflare deploy secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Missing repository secret CLOUDFLARE_API_TOKEN'
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'Missing repository secret CLOUDFLARE_ACCOUNT_ID'
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo 'Add both secrets in Settings → Secrets and variables → Actions, then re-run this workflow.'
            exit 1
          fi
      - run: npm ci && npm run build
        working-directory: packages/auth-contract
      - run: npm ci && npm run build
        working-directory: packages/lunchmoney-adapter
      - run: npm ci
        working-directory: packages/server
      # Deploy Worker code only. Do not apply D1 migrations here.
      - name: Deploy production Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/server
          wranglerVersion: '4.131.2'
          packageManager: npm
          command: deploy --config wrangler.production.jsonc
