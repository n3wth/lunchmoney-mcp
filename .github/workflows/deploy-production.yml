name: Deploy production Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/*/package-lock.json

      - run: npm ci
        working-directory: packages/auth-contract
      - run: npm ci
        working-directory: packages/lunchmoney-adapter
      - run: npm ci
        working-directory: packages/server
      - run: npm run build
        working-directory: packages/auth-contract
      - run: npm run build
        working-directory: packages/lunchmoney-adapter
      - run: npm test
        working-directory: packages/server

      - uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: packages/server
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.production.jsonc

      - name: Smoke test production endpoints
        run: |
          set -eu
          test "$(curl -fsS -o /dev/null -w '%{http_code}' https://lunchmoney.sh/)" = 200
          test "$(curl -fsS -o /dev/null -w '%{http_code}' https://mcp.lunchmoney.sh/.well-known/oauth-protected-resource)" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://mcp.lunchmoney.sh/mcp)" = 405
